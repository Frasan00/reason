name: Release

# A tag like v1.2.0 builds the release APK and publishes it as a GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Every action is pinned to a commit SHA: a tag can be moved to different code,
# a commit cannot. The comment names the release each SHA came from.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build and publish the APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The tag is untrusted text: validate it, then hand it to later steps as
      # an environment variable instead of pasting it into a shell command.
      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="${TAG#v}"
          if ! printf '%s' "$name" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Tag $TAG is not a version like v1.2.0"
            exit 1
          fi
          base="${name%%-*}"
          IFS=. read -r major minor patch <<< "$base"
          code=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      # Gradle's own cache; the Flutter one above covers the SDK and pub packages.
      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Same key as every previous release, so an update installs over the old
      # app and keeps its clips, folder and settings instead of forcing an
      # uninstall. Without the secret the APK falls back to the debug key.
      - name: Configure the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: this APK is signed with the debug key and cannot update an installed release."
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/reason-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/reason-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build the release APK
        env:
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: >
          flutter build apk --release
          --build-name="$NAME"
          --build-number="$CODE"

      - name: Name and checksum the APK
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          cd build/app/outputs/flutter-apk
          mv app-release.apk "reason-$NAME.apk"
          sha256sum "reason-$NAME.apk" > "reason-$NAME.apk.sha256"

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: reason ${{ steps.version.outputs.name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/app/outputs/flutter-apk/reason-${{ steps.version.outputs.name }}.apk
            build/app/outputs/flutter-apk/reason-${{ steps.version.outputs.name }}.apk.sha256
